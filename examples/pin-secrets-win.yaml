shell: [pwsh, -NoProfile, -Command]

secrets:
  salt: e5XgjyUaMO5ZKugmtCQhYA==
  time: 3
  memory: 65536
  threads: 4
  check: sm-enc:v1:h+Yu+4Ynn0gs+4lPMAMZS7JMW+k7mL4g3kZCz/ETZRx8rsIQry/AbCUc

env:
  region: eu-central-1
  vault_token: sm-enc:v1:b0BhQkTNv56ARQfsemw3tNtWniURjgkFOMZoiMBCo8FGnaqlpWSNQUqXuJEbfw==

display:
  - name: default
    list: "{{.name}} · {{.role}}"
    details: |
      ## {{.name}}

      | Field | Value |
      |-------|-------|
      | Host | `{{.db_host}}` |
      | User | `{{.db_user}}` |
      | Password | `{{mask .db_password}}` |
      | Vault token | `{{mask .vault_token}}` |
      | Region | `{{.region}}` |

actionGroups:
  - id: demo
    title: Demo
    color: "#7fd4ff"

actions:
  - id: show-values
    title: Show the decrypted values (needs PIN)
    description: Requires the PIN, so the locked values are decrypted and passed to the script.
    groups: [demo]
    interactive: false
    requiresPin: true
    cmd: "Write-Host \"db_user=$env:DB_USER\"; Write-Host \"db_password=$env:DB_PASSWORD\"; Write-Host \"vault_token=$env:VAULT_TOKEN\""
  - id: connect
    title: Pretend to connect (needs PIN)
    description: A second PIN-requiring action, to show the PIN is asked once per app run rather than once per action.
    groups: [demo]
    interactive: false
    requiresPin: true
    cmd: "Write-Host \"Connecting to $env:DB_HOST as $env:DB_USER in $env:REGION...\"; Start-Sleep -Seconds 1; Write-Host \"Authenticated as $env:DB_USER (not really)\""
  - id: show-values-nopin
    title: Show the same values (no PIN)
    description: The same command without requiresPin - the locked variables are never set, so they print empty. A script that needs them must say so.
    groups: [demo]
    interactive: false
    cmd: "Write-Host \"db_user=$env:DB_USER\"; Write-Host \"db_password=[$env:DB_PASSWORD]\"; Write-Host \"vault_token=[$env:VAULT_TOKEN]\""

items:
  - name: demo-database
    actionGroups: [demo]
    env:
      role: database
      db_host: db.internal.example
      db_user: appuser
      db_password: sm-enc:v1:X33Pv/DVu9pimLfIBiVH6MCJpWFh9nt10DIeoSsHk5ZzX1J87IgAuN98lVKku3o2k0X+hg0vTqA=
  - name: demo-api
    actionGroups: [demo]
    env:
      role: api service
      db_host: api.internal.example
      db_user: svc-api
      db_password: sm-enc:v1:hNfg0OvGrQjp2bjwCBoR6g49w3+H25TgHubxhL5tf7US8CUZgLUMeV88WYjh7//70FFh
  - name: demo-unlocked
    actionGroups: [demo]
    env:
      role: nothing locked here
      db_host: public.example
      db_user: anonymous
      db_password: not-a-secret
